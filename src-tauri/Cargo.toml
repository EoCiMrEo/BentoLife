[package]
name = "bentolife"
version = "0.1.0"
description = "BentoLife desktop shell"
authors = ["BentoLife"]
edition = "2021"

[workspace]
members = [".", "core"]
resolver = "2"

[lib]
name = "bentolife_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bentolife_core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
